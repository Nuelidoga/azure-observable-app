name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      keep:
        description: Keep the environment after the run (skip teardown)
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC login to Azure, no stored credentials
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  build-scan:
    name: Build image and scan with Trivy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t obsapp:${{ github.sha }} ./app
      - name: Trivy scan (fails on fixable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: obsapp:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save obsapp:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    name: Deploy, release, verify
    if: github.event_name != 'pull_request'
    needs: build-scan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}   # 'prod' can require manual approval
    concurrency: deploy-${{ inputs.environment || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
      CI: "true"
      OWNER: github-actions
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
      SQL_ADMIN_OBJECT_ID: ${{ secrets.SQL_ADMIN_OBJECT_ID }}
      SQL_ADMIN_TYPE: Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade -y
      - name: Tools for SQL grant step
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          pip install pyodbc azure-identity
      - name: Infrastructure (what-if, then deploy)
        run: ./scripts/deploy.sh "$ENV_NAME"
      - name: Grant app identity access to SQL
        run: ./scripts/post_deploy.sh "$ENV_NAME"
      - name: Release (new revision, smoke test, shift traffic, rollback on failure)
        run: IMAGE_LOCAL=obsapp:${{ github.sha }} ./scripts/release.sh "$ENV_NAME" "${GITHUB_SHA::7}"
      - name: Smoke test live URL
        run: |
          source scripts/lib.sh "$ENV_NAME"
          FQDN=$(az containerapp show -g "$RG" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Live URL: https://$FQDN"
          ./scripts/smoke_test.sh "https://$FQDN"
      - name: Teardown (dev is ephemeral)
        if: always() && env.ENV_NAME == 'dev' && inputs.keep != true
        run: ./scripts/teardown.sh "$ENV_NAME"
